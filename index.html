<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicons -->
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/web-app-manifest-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/web-app-manifest-512x512.png">

    <!-- Full-screen support on iOS -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:title" content="PropertPro — The Real Estate Marketplace for Cyprus & Greece" />
    <meta property="og:description" content="Discover real estate opportunities from trusted developers, agencies, and owners in Cyprus and Greece — all in one place." />
    <meta property="og:image" content="https://www.propertpro.com/og-preview.png" />
    <meta property="og:url" content="https://www.propertpro.com" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PropertPro — The Real Estate Marketplace for Cyprus & Greece" />
    <meta name="twitter:description" content="Discover real estate opportunities from trusted developers, agencies, and owners in Cyprus and Greece — all in one place." />
    <meta name="twitter:image" content="https://www.propertpro.com/og-preview.png" />

    <title>PropertPro — The Real Estate Marketplace for Cyprus & Greece</title>

    <!-- Google Analytics - Consent-Gated (GDPR Compliant) -->
    <script>
      // Initialize dataLayer and gtag placeholder
      window.dataLayer = window.dataLayer || [];
      function gtag(){ window.dataLayer.push(arguments); }
      
      // Flag to track if GA has been initialized
      window.gaInitialized = false;
      
      /**
       * Initialize Google Analytics (only called after user consent)
       * This function is called by the React app after consent is obtained
       */
      window.initializeGoogleAnalytics = () => {
        // Prevent double initialization
        if (window.gaInitialized) {
          console.log('Google Analytics already initialized');
          return;
        }
        
        console.log('Initializing Google Analytics with consent...');
        
        // Load GA script dynamically
        const script = document.createElement('script');
        script.async = true;
        script.src = 'https://www.googletagmanager.com/gtag/js?id=G-7S7FKWE6F7';
        document.head.appendChild(script);
        
        script.onload = () => {
          // Configure GA with privacy-friendly defaults
          gtag('js', new Date());
          gtag('config', 'G-7S7FKWE6F7', {
            'anonymize_ip': true,  // GDPR best practice
            'allow_google_signals': false,  // Disable cross-device tracking by default
            'allow_ad_personalization_signals': false  // Disable ad personalization
          });

          gtag('event', 'page_view'); // ✅ minimal + safe
          
          window.gaInitialized = true;
          console.log('Google Analytics initialized successfully');
        };
        
        script.onerror = () => {
          console.error('Failed to load Google Analytics');
        };
      };
      
      /**
       * Disable Google Analytics (called when consent is withdrawn)
       */
      window.disableGoogleAnalytics = () => {
        if (window.gaInitialized) {
          // Set opt-out property
          window['ga-disable-G-7S7FKWE6F7'] = true;
          console.log('Google Analytics disabled');
        }
      };
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
